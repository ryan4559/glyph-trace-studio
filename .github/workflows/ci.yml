name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every module
        run: |
          for f in *.js tools/*.mjs tools/tests/*.mjs; do
            node --check "$f"
          done
      - name: Unit + parity tests (no dependencies, Node stdlib only)
        run: npm test
      - name: Plate outputs match the committed files
        run: |
          node tools/build_taiwan_plates.mjs
          git diff --exit-code -- taiwan-1992/output taiwan-2012/output
